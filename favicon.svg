<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="248" height="248" rx="36" fill="url(#bg)" stroke="#27272a" stroke-width="4"/>

  <!-- pi symbol -->
  <text x="128" y="172" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace"
        font-size="140" font-weight="700" fill="url(#pi)"
        letter-spacing="-4">π</text>

  <!-- terminal cursor -->
  <rect x="148" y="36" width="28" height="8" rx="4" fill="#34d399" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
